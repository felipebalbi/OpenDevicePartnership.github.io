[package]
name = "odp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "odp"
path = "src/bin/server.rs"

[dependencies]
unocss-classes = "2"

# Leptos: server-side only. The site is pure static (SSG) with a
# small amount of vanilla JS for interactivity (theme toggle, mobile
# nav, video facade); there is no client-side Leptos runtime, hence
# no `hydrate` feature and no wasm bundle.
leptos = { version = "0.8.2", default-features = false, features = ["ssr"] }
leptos_meta = { version = "0.8.2", default-features = false, features = ["ssr"] }
leptos_router = { version = "0.8.2", default-features = false, features = ["ssr"] }
leptos_axum = "0.8.2"

# SSR + prerender stack. The bin renders every route once and writes
# `target/site/<route>/index.html`; the axum server itself never runs
# in production.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
http = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
