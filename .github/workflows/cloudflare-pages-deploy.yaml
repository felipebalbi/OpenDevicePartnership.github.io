name: Release to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # for committing branch.
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "cfpages"
  cancel-in-progress: false

jobs:
  Cloudflare-Pages-Release:

    timeout-minutes: 10

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # repo checkout

      # Install stable Rust + the wasm32 target. cargo-leptos handles
      # the hydrate-side wasm build itself but needs the target
      # installed in the toolchain.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: lint
        run: |
          cargo clippy --all-features -- -D warnings
          cargo fmt --check

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # cargo-leptos drives the full SSR + hydrate dual-build and the
      # asset hashing/minification pipeline. Pinned to match the
      # version contributors install locally.
      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.6

      # One-shot production build: npm ci -> CSS pipeline ->
      # cargo leptos build --release -> postbuild (minify lazy JS,
      # drop .d.ts) -> prerender every route to target/site/.
      - name: Build static site
        run: ./scripts/build.sh

      # Deploy the prerendered tree.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: './target/site'
          # Optional: Enable this if you want to have GitHub Deployments triggered
          # gitHubToken: ${{ secrets.GH_TOKEN }}
